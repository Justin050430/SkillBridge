# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - skillbridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets with Vite
        run: npm run build

      - name: Verify Vite manifest was generated
        run: |
          test -f public/build/manifest.json && echo "manifest.json OK" || { echo "ERROR: public/build/manifest.json not generated"; exit 1; }

      # ------------------------------------------------------------------
      # Why this changed:
      # The old workflow uploaded the ENTIRE workspace (`path: .`) as a GitHub
      # Actions artifact (~16k files: vendor/ + node_modules/ + everything else).
      # That exhausted the repository's artifact-storage quota ("Artifact
      # storage quota has been hit"). This workflow now builds AND deploys in a
      # single job and NEVER uploads an artifact, so the quota no longer applies.
      # Only the files Laravel needs at runtime are copied into ./deploy
      # (node_modules, .git, .github, tests and docs are excluded, while
      # vendor/ and public/build/ are kept - both are required on Azure).
      # ------------------------------------------------------------------
      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          tar \
            --exclude='./deploy' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./Assignment' \
            --exclude='./tests' \
            --exclude='./.env' \
            --exclude='./.env.backup' \
            --exclude='./.env.production' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            --exclude='./storage/logs/*' \
            -cf /tmp/skillbridge-deploy.tar .
          tar -xf /tmp/skillbridge-deploy.tar -C deploy
          rm -f /tmp/skillbridge-deploy.tar
          # Laravel runtime directories must exist on the deployed app.
          mkdir -p deploy/storage/framework/cache deploy/storage/framework/sessions deploy/storage/framework/views deploy/storage/logs
          test -f deploy/public/build/manifest.json && echo "deploy package OK (manifest.json present)"
          echo "Deployment package file count: $(find deploy -type f | wc -l)"

      # Deploy using the App Service publish profile (stored in the
      # AZURE_WEBAPP_PUBLISH_PROFILE secret). This targets the app directly and
      # avoids the OIDC app-name / subscription mismatch ("Resource ... of type
      # Microsoft.Web/Sites doesn't exist").
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy
